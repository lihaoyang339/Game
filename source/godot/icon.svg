  <polygon points="20,100 20,55 35,55 35,40 64,25 93,40 93,55 108,55 108,100" fill="#2d2d4e" stroke="#6b6b9a" stroke-width="1.5"/>
  <!-- tower -->
  <rect x="56" y="20" width="16" height="35" fill="#2d2d4e" stroke="#6b6b9a" stroke-width="1.5"/>
  <polygon points="56,20 64,8 72,20" fill="#3d3d6e"/>
  <!-- lit window -->
  <rect x="58" y="30" width="12" height="10" fill="#f0c060" opacity="0.85"/>

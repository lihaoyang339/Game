  <rect x="28" y="65" width="10" height="14" fill="#8080a0" opacity="0.5"/>
  <rect x="90" y="65" width="10" height="14" fill="#8080a0" opacity="0.5"/>
  <rect x="58" y="65" width="12" height="14" fill="#8080a0" opacity="0.5"/>
  <!-- door -->
  <rect x="58" y="84" width="12" height="16" fill="#1a1a2e" stroke="#6b6b9a" stroke-width="1"/>
